<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Student Feedback System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{{ url_for('index') }}">Student Feedback System</a>
        <a class="nav-link" href="{{ url_for('index') }}">Home</a>
    </header>

    <main class="container narrow">
        <section class="card reveal">
            <h2>Admin Login</h2>
            <p class="muted">Sign in to view submitted feedback.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="messages">
                    {% for category, message in messages %}
                        <div class="alert {{ category }}">{{ message }}</div>
                    {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('admin_login') }}">
                <div class="field">
                    <label class="label" for="username">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" required>
                </div>

                <div class="field">
                    <label class="label" for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Log in</button>
            </form>

            <p class="hint test-login">Local testing login: <strong>admin</strong> / <strong>admin123</strong></p>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
        if (window.gsap && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            gsap.from(".reveal", { y: 20, opacity: 0, duration: 0.6, ease: "power2.out" });
        }
    </script>
</body>
</html>
