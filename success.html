<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Submitted - Student Feedback System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{{ url_for('index') }}">Student Feedback System</a>
    </header>

    <main class="container narrow">
        <section class="card center reveal">
            <div class="tick">&#10003;</div>
            <h2>Feedback submitted</h2>
            <p class="muted">Thank you! Your feedback has been saved.</p>

            <div class="button-row">
                <a class="btn btn-primary" href="{{ url_for('feedback') }}">Give more feedback</a>
                <a class="btn btn-outline" href="{{ url_for('index') }}">Back to home</a>
            </div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
        if (window.gsap && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            gsap.from(".reveal", { y: 20, opacity: 0, duration: 0.6, ease: "power2.out" });
        }
    </script>
</body>
</html>
